services:
  - type: web
    name: osint-bot
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: HIBP_KEY
        sync: false
      - key: NUMVERIFY_KEY
        sync: false
